[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bplusproject"
version = "1.0.0"
description = "An educational B+ tree with terminal and Tkinter explorers"
requires-python = ">=3.10"

[project.scripts]
bplus-tree = "main:main"

[tool.setuptools]
packages = ["bplustree"]
py-modules = ["main", "utils", "script"]
